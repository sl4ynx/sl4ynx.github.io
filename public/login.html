<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso – Sl4ynxIA</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0a0710; --bg-2: #120c1d; --card: #181026; --border: rgba(255,255,255,.08);
    --text: #f4eefb; --muted: #a99bc0; --pink: #ff3d8b; --purple: #8a4dff; --danger: #ff5470; --ok: #38d9a0;
    --grad: linear-gradient(135deg, var(--pink), var(--purple));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; font-size: .95rem; color: var(--text); }
  .hidden { display: none !important; }
  .logo { font-weight: 800; font-size: 1.6rem; letter-spacing: -.5px; text-align: center; margin-bottom: 8px; }
  .logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 999px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--grad); box-shadow: 0 6px 24px rgba(255,61,139,.3); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .full { width: 100%; }

  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; outline: none; transition: border-color .2s; }
  input:focus { border-color: var(--pink); }
  .field { margin-bottom: 16px; }
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 76px; }
  .pass-wrap button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .8rem; padding: 6px 8px; }
  .pass-wrap button:hover { color: var(--text); }
  .msg { font-size: .88rem; margin-bottom: 14px; padding: 10px 14px; border-radius: 10px; }
  .msg.error { background: rgba(255,84,112,.12); color: var(--danger); }
  .msg.ok { background: rgba(56,217,160,.12); color: var(--ok); }

  #auth { min-height: 100vh; display: grid; place-items: center; padding: 20px; position: relative; overflow: hidden; }
  #auth::before, #auth::after { content: ""; position: absolute; border-radius: 50%; filter: blur(120px); opacity: .45; z-index: 0; }
  #auth::before { width: 420px; height: 420px; background: var(--pink); top: -100px; left: -100px; }
  #auth::after { width: 480px; height: 480px; background: var(--purple); bottom: -140px; right: -120px; }
  .auth-box { position: relative; z-index: 1; width: min(430px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 36px 32px; }
  .sub { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: .92rem; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); border-radius: 999px; padding: 4px; margin-bottom: 24px; }
  .tabs button { background: none; border: 0; padding: 9px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tabs button.active { background: var(--grad); color: #fff; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .83rem; color: var(--muted); margin-bottom: 18px; }
  .check input { width: auto; margin-top: 4px; }
  .back { display: block; text-align: center; margin-top: 18px; color: var(--muted); font-size: .88rem; }
  .back:hover { color: var(--text); }
</style>
</head>
<body>

<div id="auth">
  <div class="auth-box">
    <div class="logo">Sl4ynx<span>IA</span></div>
    <p class="sub">Accede a tu panel privado</p>
    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" class="active" role="tab">Iniciar sesión</button>
      <button type="button" id="tab-register" role="tab">Crear cuenta</button>
    </div>
    <div id="auth-msg" class="msg hidden" role="alert"></div>

    <form id="form-login">
      <div class="field"><label for="l-email">Correo electrónico</label><input id="l-email" type="email" required maxlength="254" autocomplete="email"></div>
      <div class="field">
        <label for="l-pass">Contraseña</label>
        <div class="pass-wrap"><input id="l-pass" type="password" required maxlength="72" autocomplete="current-password"><button type="button" data-toggle="l-pass">Mostrar</button></div>
      </div>
      <button class="btn btn-primary full" type="submit">Entrar</button>
    </form>

    <form id="form-register" class="hidden">
      <div class="field"><label for="r-name">Nombre de usuario</label><input id="r-name" type="text" required minlength="2" maxlength="30" autocomplete="username"></div>
      <div class="field"><label for="r-email">Correo electrónico</label><input id="r-email" type="email" required maxlength="254" autocomplete="email"></div>
      <div class="field">
        <label for="r-pass">Contraseña (mín. 8 caracteres)</label>
        <div class="pass-wrap"><input id="r-pass" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><button type="button" data-toggle="r-pass">Mostrar</button></div>
      </div>
      <div class="field"><label for="r-pass2">Repite la contraseña</label><input id="r-pass2" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></div>
      <label class="check"><input id="r-age" type="checkbox" required> Confirmo que tengo 18 años o más y acepto los términos y la política de privacidad.</label>
      <button class="btn btn-primary full" type="submit">Crear cuenta</button>
    </form>
    <a class="back" href="index.html">← Volver al inicio</a>
  </div>
</div>

<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
